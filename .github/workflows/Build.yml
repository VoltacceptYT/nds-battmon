name: Build NDS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240202
    steps:
      - uses: actions/checkout@v4
      - name: Assemble project from libnds combined template
        run: |
          git clone https://github.com/devkitPro/nds-examples.git /tmp/ex
          cd /tmp/ex
          git checkout "$(git rev-list -n1 --before=2024-02-02 HEAD)"
          cd "$GITHUB_WORKSPACE"
          T=$(find /tmp/ex -type d -path "*templates/combined" | head -1)
          echo "Using template: $T"
          cp -r "$T" /tmp/proj
          cp arm9/source/main.c /tmp/proj/arm9/source/main.c
          cp arm7/source/main.c /tmp/proj/arm7/source/main.c
          cd /tmp/proj && make
          cp /tmp/proj/*.nds "$GITHUB_WORKSPACE/battmon.nds"
      - uses: actions/upload-artifact@v4
        with:
          name: battmon-nds
          path: battmon.nds
