name: Build NDS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20240202
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH
          L=$DEVKITPRO/libnds
          ls $L
          arm-none-eabi-gcc -specs=ds_arm9.specs -mthumb -mthumb-interwork -march=armv5te -mtune=arm946e-s -O2 -DARM9 -I$L/include arm9/source/main.c -L$L/lib -lnds9 -o arm9.elf
          arm-none-eabi-gcc -specs=ds_arm7.specs -mthumb-interwork -mcpu=arm7tdmi -mtune=arm7tdmi -O2 -DARM7 -I$L/include arm7/source/main.c -L$L/lib -lnds7 -o arm7.elf
          ndstool -c battmon.nds -7 arm7.elf -9 arm9.elf
      - uses: actions/upload-artifact@v4
        with:
          name: battmon-nds
          path: battmon.nds
