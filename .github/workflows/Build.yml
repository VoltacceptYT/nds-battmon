name: Build NDS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned to an older devkitARM image so libnds is 1.x (the code uses the 1.x FIFO API).
    container: devkitpro/devkitarm:20240202
    steps:
      - uses: actions/checkout@v4
      - name: Assemble project from libnds combined template
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/ex
          cp -r /tmp/ex/templates/combined /tmp/proj
          cp arm9/source/main.c /tmp/proj/arm9/source/main.c
          cp arm7/source/main.c /tmp/proj/arm7/source/main.c
          cd /tmp/proj && make
          cp /tmp/proj/*.nds "$GITHUB_WORKSPACE/battmon.nds"
      - uses: actions/upload-artifact@v4
        with:
          name: battmon-nds
          path: battmon.nds
          
